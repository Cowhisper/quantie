    - [sh.601012, 隆基绿能, 光伏]
    - [sh.600276, 恒瑞医药, 医药]
    - [sz.000001, 平安银行, 银行]
    - [sz.300059, 东方财富, 券商]
    - [sh.601888, 中国中免, 免税]
